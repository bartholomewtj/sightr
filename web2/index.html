<!doctype html>
<!-- web2 is dark by default (style/tokens.md, recipe console). theme-init.js adds `light` (pinned Light)
     or `system` (follow the OS) before first paint. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <script src="%BASE_URL%theme-init.js"></script>
    <meta name="theme-color" content="#171b21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sightr v2" />
    <title>Sightr v2</title>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <style>
      /* index.css has not loaded yet; paper and muted from tokens.md console, dark and light. */
      :root { color-scheme: dark; }
      :root.light { color-scheme: light; }
      :root.system { color-scheme: light dark; }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: light-dark(#f4f5f6, #171b21);
        color: light-dark(#5b646d, #8a929b);
        font: 400 0.875rem/1.4 "Segoe UI", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Loading Sightr">Connecting to the herd…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
